<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — KaamFlow</title>
  <meta name="description" content="Manage your customers and their order history — KaamFlow.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://apis.mappls.com/advancedmaps/api/zhnqlemwzlzynhrakcsyrjnkystkmxktwmbd/map_sdk?v=3.0&layer=vector"></script>
</head>
<body>
  <div id="app">

    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Customers</h1>
    </div>

    <!-- Master-Detail Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

      <!-- Left: Customer List (2/5) -->
      <div class="lg:col-span-2 space-y-3">
        <!-- Search -->
        <div class="relative mb-4">
          <i data-lucide="search" style="width:18px;height:18px;position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8"></i>
          <input type="text" id="customer-search" class="input" style="padding-left:40px" placeholder="Search customers..." oninput="filterCustomers()">
        </div>
        <div id="customer-list" class="space-y-2">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Right: Customer Detail (3/5) -->
      <div class="lg:col-span-3" id="customer-detail">
        <!-- Empty state -->
        <div id="detail-empty" class="card flex flex-col items-center justify-center py-16 text-center">
          <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mb-4">
            <i data-lucide="users" class="text-slate-400" style="width:28px;height:28px"></i>
          </div>
          <h3 class="font-semibold text-slate-700 mb-1">Select a customer</h3>
          <p class="text-sm text-slate-400">Click on a customer to view their details</p>
        </div>
        <!-- Detail panel -->
        <div id="detail-panel" class="hidden">
          <div id="detail-content"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/status.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/parser-bridge.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/shell.js"></script>
  <script type="module" src="js/firebase-bridge.js"></script>
  <script>
    var selectedCustomerId = null;

    function filterCustomers() {
      renderCustomerList(document.getElementById('customer-search').value);
    }

    function renderCustomerList(search) {
      var customers = DataStore.getCustomers();
      if (search) {
        var q = search.toLowerCase();
        customers = customers.filter(function(c) { return c.name.toLowerCase().includes(q) || c.phone.includes(q); });
      }

      var html = '';
      customers.forEach(function(c) {
        var orders = DataStore.getCustomerOrders(c.id);
        var totalSpent = DataStore.getCustomerTotalSpent(c.id);
        var pending = DataStore.getCustomerPendingDues(c.id);
        var lastOrder = orders.sort(function(a, b) { return (b._created_at || '').localeCompare(a._created_at || ''); })[0];
        var isSelected = c.id === selectedCustomerId;

        html += '<div class="card card-clickable ' + (isSelected ? 'ring-2 ring-blue-400 border-blue-200' : '') + '" ' +
          'style="padding:14px 16px;cursor:pointer" onclick="selectCustomer(\'' + c.id + '\')">' +
          '<div class="flex items-start justify-between mb-2">' +
          '<div class="flex items-center gap-3">' +
          Shell.renderAvatar(c.name, 'sm', c.id) +
          '<div><p class="font-semibold text-sm text-slate-900">' + c.name + '</p></div></div>' +
          (pending > 0 ? '<span class="badge badge-danger text-xs">' + DataStore.formatCurrency(pending) + ' pending</span>' : '<span class="badge badge-success text-xs">Paid</span>') +
          '</div>' +
          '<div class="flex items-center gap-4 text-xs text-slate-500 ml-11">' +
          '<span><i data-lucide="file-text" style="width:12px;height:12px;display:inline;vertical-align:middle;margin-right:2px"></i> ' + orders.length + ' orders</span>' +
          '<span><i data-lucide="wallet" style="width:12px;height:12px;display:inline;vertical-align:middle;margin-right:2px"></i> ' + DataStore.formatCurrency(totalSpent) + ' total</span>' +
          (lastOrder ? '<span><i data-lucide="clock" style="width:12px;height:12px;display:inline;vertical-align:middle;margin-right:2px"></i> Last: ' + DataStore.relativeTime(lastOrder._created_at) + '</span>' : '') +
          '</div></div>';
      });

      if (customers.length === 0) {
        html = '<div class="text-center py-8 text-slate-400"><p class="text-sm">No customers found</p></div>';
      }

      document.getElementById('customer-list').innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    function selectCustomer(id) {
      selectedCustomerId = id;
      renderCustomerList(document.getElementById('customer-search').value);
      renderCustomerDetail(id);
    }

    function renderCustomerDetail(id) {
      var customer = DataStore.getCustomer(id);
      if (!customer) return;

      document.getElementById('detail-empty').classList.add('hidden');
      var panel = document.getElementById('detail-panel');
      panel.classList.remove('hidden');
      var content = document.getElementById('detail-content');

      var orders = DataStore.getCustomerOrders(id);
      var totalSpent = DataStore.getCustomerTotalSpent(id);
      var pending = DataStore.getCustomerPendingDues(id);
      var lastOrder = orders.sort(function(a, b) { return (b._created_at || '').localeCompare(a._created_at || ''); })[0];

      // Header
      var html = '<div class="card mb-4" style="animation:slideUp 0.3s ease-out">' +
        '<div class="flex items-center gap-4 mb-4">' +
        Shell.renderAvatar(customer.name, 'lg', customer.id) +
        '<div><h2 class="font-bold text-lg text-slate-900">' + customer.name + '</h2>' +
        '<p class="text-sm text-slate-500 flex items-center gap-1"><i data-lucide="phone" style="width:14px;height:14px"></i> ' + customer.phone + '</p>' +
        '<p class="text-xs text-slate-400">Customer since ' + DataStore.formatDate(customer.since) + '</p></div></div>';

      // Stats
      html += '<div class="grid grid-cols-2 gap-3 mb-4">' +
        '<div class="p-4 rounded-xl bg-slate-50 border border-slate-200">' +
        '<p class="text-xs text-slate-500 uppercase font-semibold tracking-wider">Total Orders</p>' +
        '<p class="text-2xl font-bold text-slate-900 mt-1">' + orders.length + '</p></div>' +
        '<div class="p-4 rounded-xl bg-slate-50 border border-slate-200">' +
        '<p class="text-xs text-slate-500 uppercase font-semibold tracking-wider">Total Spent</p>' +
        '<p class="text-2xl font-bold text-slate-900 mt-1">' + DataStore.formatCurrency(totalSpent) + '</p></div></div>';

      // Pending Dues
      if (pending > 0) {
        html += '<div class="p-4 rounded-xl bg-red-50 border border-red-200 mb-4 flex items-center justify-between">' +
          '<div><p class="text-xs text-red-600 font-semibold uppercase">Pending Dues</p>' +
          '<p class="text-2xl font-bold text-red-600 mt-1">' + DataStore.formatCurrency(pending) + '</p></div>' +
          '<button class="btn btn-secondary btn-sm" onclick="recordPaymentForCustomer(\'' + id + '\')">Record Payment</button></div>';
      }

      html += '</div>';

      // Last Order Details
      if (lastOrder) {
        html += '<div class="card mb-4" style="animation:slideUp 0.4s ease-out">' +
          '<h3 class="text-xs text-slate-500 uppercase font-semibold tracking-wider mb-3">Last Order Details</h3>' +
          '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200 mb-3">' +
          '<div class="flex items-center justify-between mb-2">' +
          '<span class="font-semibold text-sm">Order #' + lastOrder.id.replace('ord-','') + '</span>' +
          '<span class="text-xs text-slate-400">' + DataStore.relativeTime(lastOrder._created_at) + '</span></div>' +
          '<p class="text-sm text-slate-700">' + lastOrder.items.map(function(it) { return it.quantity + ' × ' + it.description; }).join(', ') + '</p>' +
          '<div class="flex flex-wrap gap-1 mt-2">' + Shell.renderAttributeChips(lastOrder.items[0] ? lastOrder.items[0].attributes : {}) + '</div></div>' +
          '<button class="btn btn-primary w-full" onclick="repeatOrder(\'' + lastOrder.id + '\')"><i data-lucide="repeat" style="width:16px;height:16px"></i> Repeat Previous Order</button></div>';
      }

      // Order History
      html += '<div class="card" style="animation:slideUp 0.5s ease-out">' +
        '<h3 class="text-xs text-slate-500 uppercase font-semibold tracking-wider mb-3">Order History</h3>';

      if (orders.length === 0) {
        html += '<p class="text-sm text-slate-400 text-center py-4">No order history</p>';
      } else {
        orders.forEach(function(order, idx) {
          var itemSummary = order.items.map(function(it) { return it.description + ' (x' + it.quantity + ')'; }).join(', ');
          var payHtml = order._payment_status === 'paid'
            ? '<span class="text-green-600 text-xs font-medium">Paid ' + DataStore.formatCurrency(order.amount) + '</span>'
            : '<span class="text-red-600 text-xs font-medium">' + DataStore.formatCurrency(order.amount) + ' pending</span>';

          html += '<div class="flex gap-3 ' + (idx < orders.length - 1 ? 'pb-4 mb-4 border-b border-slate-100' : '') + '">' +
            '<div class="flex flex-col items-center">' +
            '<div class="w-2.5 h-2.5 rounded-full ' + (idx === 0 ? 'bg-slate-900' : 'bg-slate-300') + ' mt-1"></div>' +
            (idx < orders.length - 1 ? '<div class="w-0.5 flex-1 bg-slate-200 mt-1"></div>' : '') +
            '</div>' +
            '<div class="flex-1">' +
            '<div class="flex items-center justify-between">' +
            '<p class="font-semibold text-sm text-slate-900">#' + order.id.replace('ord-','') + '</p>' +
            '<span class="text-xs text-slate-400">' + DataStore.relativeTime(order._created_at) + '</span></div>' +
            '<p class="text-sm text-slate-600">' + itemSummary + '</p>' +
            '<div class="mt-1">' + payHtml + '</div>' +
            '</div></div>';
        });
      }

      html += '</div>';
      content.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    function repeatOrder(orderId) {
      var original = DataStore.getOrder(orderId);
      if (!original) return;
      var newOrder = JSON.parse(JSON.stringify(original));
      newOrder.id = DataStore.generateOrderId();
      newOrder._status = 'new';
      newOrder._payment_status = 'unpaid';
      newOrder._created_at = new Date().toISOString();
      newOrder.due_date = null;
      newOrder.references_prior_order = true;
      DataStore.saveOrder(newOrder);
      alert('Order #' + newOrder.id.replace('ord-','') + ' created as a repeat of #' + orderId.replace('ord-','') + '!');
    }

    function recordPaymentForCustomer(customerId) {
      var customer = DataStore.getCustomer(customerId);
      var pending = DataStore.getCustomerPendingDues(customerId);
      var amount = prompt('Record payment for ' + customer.name + '\nPending: ' + DataStore.formatCurrency(pending) + '\n\nEnter amount:', pending);
      if (amount && !isNaN(amount)) {
        DataStore.recordPayment({ customer_id: customerId, amount: parseInt(amount), method: 'Cash' });
        renderCustomerDetail(customerId);
        renderCustomerList(document.getElementById('customer-search').value);
      }
    }

    // Initial render
    renderCustomerList('');

    // Auto-select first customer on desktop
    if (window.innerWidth >= 1024) {
      var customers = DataStore.getCustomers();
      if (customers.length > 0) selectCustomer(customers[0].id);
    }
  </script>
</body>
</html>
